# ---------------------------------------------------------------------------
# Staging tests: the basic shape of each source.
#
# We test IDs and key fields as EARLY as possible. If a raw file arrives
# broken, `dbt build` fails here and never builds the cleaned layer on top.
# ---------------------------------------------------------------------------

version: 2

models:
  - name: stg_bank_transactions
    description: Bank statement lines, typed. One row per raw row.
    columns:
      - name: bank_txn_id
        data_tests: [unique, not_null]
      - name: value_date
        data_tests: [not_null]
      - name: description
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]

  - name: stg_gl_entries
    description: Cash-account ledger entries, typed. One row per raw row.
    columns:
      - name: gl_entry_id
        data_tests: [unique, not_null]
      - name: posting_date
        data_tests: [not_null]
      - name: account
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]

  - name: stg_agent_proposals
    description: One proposal per row. A case may appear more than once (re-runs).
    columns:
      - name: proposal_id
        data_tests: [unique, not_null]
      - name: case_id
        data_tests: [not_null]
      - name: created_at
        data_tests: [not_null]
      - name: classification
        data_tests:
          - accepted_values:
              arguments:
                values: [timing_difference, duplicate, bank_fee, fx_difference,
                         missing_ledger_entry, amount_mismatch]

  - name: stg_agent_decisions
    description: One human decision per row; append-only, so re-decisions are kept.
    columns:
      - name: decision_id
        data_tests: [unique, not_null]
      - name: proposal_id
        data_tests: [not_null]
      - name: reviewer
        description: An audit log must say who decided.
        data_tests: [not_null]
      - name: decision
        data_tests:
          - accepted_values:
              arguments:
                values: [approved, rejected]

  - name: stg_agent_case_runs
    description: One row per case per run.
    columns:
      - name: case_run_id
        description: Surrogate key (run_id + case_id) — enforces the grain.
        data_tests: [unique, not_null]
      - name: run_id
        data_tests: [not_null]
      - name: case_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, no_proposal, hit_iteration_cap, refused, error]

  - name: stg_documents
    description: Supporting documents. One row per text file.
    columns:
      - name: doc_id
        data_tests: [unique, not_null]
      - name: doc_type
        data_tests: [not_null]
      - name: content
        data_tests: [not_null]
